id: ads-real-server-smoke
namespace: io.kestra.plugin.beckhoff.ads

tasks:
  - id: read-real-variable
    type: io.kestra.plugin.beckhoff.ads.tasks.AdsRead
    connection:
      targetIp: "{{ env.ADS_TARGET_IP | default('localhost') }}"
      targetAmsNetId: "{{ env.ADS_TARGET_AMS_NET_ID | default('199.4.42.250.1.1') }}"
      targetAmsPort: "{{ env.ADS_TARGET_AMS_PORT | default('851') }}"
      localAmsNetId: "{{ env.ADS_LOCAL_AMS_NET_ID | default('') }}"
      autoAddRoute: "{{ env.ADS_AUTO_ADD_ROUTE | default(false) }}"
    variable: "{{ env.ADS_REAL_VARIABLE | default('MAIN.nAdsKestraTest') }}"
    dataType: "{{ env.ADS_REAL_DATATYPE | default('DINT') }}"

  - id: write-real-variable
    type: io.kestra.plugin.beckhoff.ads.tasks.AdsWrite
    connection:
      targetIp: "{{ env.ADS_TARGET_IP | default('localhost') }}"
      targetAmsNetId: "{{ env.ADS_TARGET_AMS_NET_ID | default('199.4.42.250.1.1') }}"
      targetAmsPort: "{{ env.ADS_TARGET_AMS_PORT | default('851') }}"
      localAmsNetId: "{{ env.ADS_LOCAL_AMS_NET_ID | default('') }}"
      autoAddRoute: "{{ env.ADS_AUTO_ADD_ROUTE | default(false) }}"
    variable: "{{ env.ADS_REAL_WRITE_VARIABLE | default(env.ADS_REAL_VARIABLE | default('MAIN.nAdsKestraTest')) }}"
    value: "{{ outputs['read-real-variable'].value }}"
    dataType: "{{ env.ADS_REAL_DATATYPE | default('DINT') }}"
